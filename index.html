<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Star Wars: A New Hope - The Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Arial', sans-serif;
}
canvas {
  border: 1px solid #333;
  image-rendering: pixelated;
  max-width: 100vw;
  max-height: 100vh;
}
#touch-controls {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#touch-controls .btn {
  position: absolute;
  pointer-events: auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-weight: bold;
  color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.2);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#touch-controls .btn.active {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.5);
}
/* D-pad buttons */
.dpad-left, .dpad-right {
  width: 64px; height: 64px;
  bottom: 30px;
  font-size: 28px;
}
.dpad-left { left: 20px; }
.dpad-right { left: 100px; }
/* Jump button */
.btn-jump {
  width: 70px; height: 70px;
  bottom: 100px; right: 20px;
  font-size: 13px;
  background: rgba(79,195,247,0.12) !important;
  border-color: rgba(79,195,247,0.35) !important;
}
.btn-jump.active {
  background: rgba(79,195,247,0.35) !important;
}
/* Attack button */
.btn-attack {
  width: 64px; height: 64px;
  bottom: 25px; right: 100px;
  font-size: 11px;
  background: rgba(76,175,80,0.12) !important;
  border-color: rgba(76,175,80,0.35) !important;
}
.btn-attack.active {
  background: rgba(76,175,80,0.35) !important;
}
/* Block button */
.btn-block {
  width: 56px; height: 56px;
  bottom: 25px; right: 20px;
  font-size: 10px;
  background: rgba(255,193,7,0.12) !important;
  border-color: rgba(255,193,7,0.35) !important;
}
.btn-block.active {
  background: rgba(255,193,7,0.35) !important;
}
/* Force buttons row */
.btn-push, .btn-pull, .btn-speed {
  width: 48px; height: 48px;
  font-size: 9px;
}
.btn-push {
  bottom: 105px; right: 100px;
  background: rgba(123,31,162,0.12) !important;
  border-color: rgba(123,31,162,0.4) !important;
}
.btn-push.active { background: rgba(123,31,162,0.4) !important; }
.btn-pull {
  bottom: 160px; right: 55px;
  background: rgba(79,195,247,0.12) !important;
  border-color: rgba(79,195,247,0.4) !important;
}
.btn-pull.active { background: rgba(79,195,247,0.4) !important; }
.btn-speed {
  bottom: 160px; right: 115px;
  background: rgba(255,109,0,0.12) !important;
  border-color: rgba(255,109,0,0.4) !important;
}
.btn-speed.active { background: rgba(255,109,0,0.4) !important; }
.btn-pause {
  width: 40px; height: 40px;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  background: rgba(255,255,255,0.06) !important;
  border-color: rgba(255,255,255,0.15) !important;
}
#orientation-prompt {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #FFD700;
  font-family: Arial, sans-serif;
  text-align: center;
}
#orientation-prompt .rotate-icon {
  font-size: 64px;
  margin-bottom: 20px;
  animation: rotate-nudge 1.5s ease-in-out infinite;
}
@keyframes rotate-nudge {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}
#orientation-prompt p {
  font-size: 18px;
  color: #fff;
  margin-top: 10px;
}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="orientation-prompt">
  <div class="rotate-icon">&#128241;</div>
  <div style="font-size:24px;color:#FFD700;font-weight:bold;">Rotate Your Device</div>
  <p>This game plays best in landscape mode</p>
</div>
<div id="touch-controls">
  <div class="btn dpad-left" data-key="ArrowLeft">&#9664;</div>
  <div class="btn dpad-right" data-key="ArrowRight">&#9654;</div>
  <div class="btn btn-jump" data-key="Space">JUMP</div>
  <div class="btn btn-attack" data-key="KeyZ">ATK</div>
  <div class="btn btn-block" data-key="KeyA">BLK</div>
  <div class="btn btn-pause" id="btn-pause">| |</div>
  <div class="btn btn-push" data-key="KeyX">PUSH</div>
  <div class="btn btn-pull" data-key="KeyC">PULL</div>
  <div class="btn btn-speed" data-key="KeyS">SPD</div>
</div>
<script>
// ============================================================
// STAR WARS: A NEW HOPE — THE GAME
// Single-file HTML5 Canvas side-scroller
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
const LEVEL_WIDTH = 14000;
const GRAVITY = 0.6;
const FRICTION = 0.85;

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
let masterGain = null;
let saberHumOsc = null;
let saberHumGain = null;

let marchPlaying = false;
let marchInterval = null;
let marchOscillators = [];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}

// Imperial March - synthesized background music
function playImperialMarch() {
  if (!audioCtx || marchPlaying) return;
  marchPlaying = true;
  // Imperial March melody notes (frequency, duration, startBeat)
  const tempo = 0.45; // seconds per beat
  const melody = [
    // Main theme phrase 1
    {f: 392, d: 1}, {f: 392, d: 1}, {f: 392, d: 1},
    {f: 311, d: 0.75}, {f: 466, d: 0.25},
    {f: 392, d: 1}, {f: 311, d: 0.75}, {f: 466, d: 0.25},
    {f: 392, d: 2},
    // Phrase 2
    {f: 587, d: 1}, {f: 587, d: 1}, {f: 587, d: 1},
    {f: 622, d: 0.75}, {f: 466, d: 0.25},
    {f: 370, d: 1}, {f: 311, d: 0.75}, {f: 466, d: 0.25},
    {f: 392, d: 2},
    // Phrase 3
    {f: 784, d: 1}, {f: 392, d: 0.75}, {f: 392, d: 0.25},
    {f: 784, d: 1}, {f: 740, d: 0.75}, {f: 698, d: 0.25},
    {f: 659, d: 0.25}, {f: 622, d: 0.25}, {f: 659, d: 0.5},
    {f: 0, d: 0.5}, {f: 415, d: 0.5}, {f: 554, d: 1},
    {f: 523, d: 0.75}, {f: 494, d: 0.25},
    {f: 466, d: 0.25}, {f: 440, d: 0.25}, {f: 466, d: 0.5},
    {f: 0, d: 0.5}, {f: 311, d: 0.5},
    // Phrase 4
    {f: 370, d: 1}, {f: 311, d: 0.75}, {f: 392, d: 0.25},
    {f: 466, d: 1}, {f: 392, d: 0.75}, {f: 466, d: 0.25},
    {f: 587, d: 2}
  ];

  function playMelodyOnce(startTime) {
    let t = startTime;
    melody.forEach(note => {
      if (note.f > 0) {
        // Main voice
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'square';
        o.frequency.value = note.f;
        g.gain.setValueAtTime(0.06, t);
        g.gain.setValueAtTime(0.06, t + note.d * tempo - 0.05);
        g.gain.linearRampToValueAtTime(0, t + note.d * tempo);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + note.d * tempo);
        marchOscillators.push(o);
        // Harmony voice (one octave lower, quieter)
        const o2 = audioCtx.createOscillator();
        const g2 = audioCtx.createGain();
        o2.type = 'triangle';
        o2.frequency.value = note.f / 2;
        g2.gain.setValueAtTime(0.03, t);
        g2.gain.setValueAtTime(0.03, t + note.d * tempo - 0.05);
        g2.gain.linearRampToValueAtTime(0, t + note.d * tempo);
        o2.connect(g2); g2.connect(masterGain);
        o2.start(t); o2.stop(t + note.d * tempo);
        marchOscillators.push(o2);
      }
      t += note.d * tempo;
    });
    return t; // return end time
  }

  function loopMarch() {
    const now = audioCtx.currentTime;
    const endTime = playMelodyOnce(now + 0.1);
    const duration = (endTime - now - 0.1) * 1000;
    marchInterval = setTimeout(loopMarch, duration + 500);
  }
  loopMarch();
}

function stopImperialMarch() {
  marchPlaying = false;
  if (marchInterval) { clearTimeout(marchInterval); marchInterval = null; }
  marchOscillators.forEach(o => { try { o.stop(); } catch(_) {} });
  marchOscillators = [];
}

function startSaberHum() {
  if (!audioCtx || saberHumOsc) return;
  saberHumOsc = audioCtx.createOscillator();
  saberHumGain = audioCtx.createGain();
  saberHumOsc.type = 'sawtooth';
  saberHumOsc.frequency.value = 110;
  saberHumGain.gain.value = 0.03;
  saberHumOsc.connect(saberHumGain);
  saberHumGain.connect(masterGain);
  saberHumOsc.start();
}

function stopSaberHum() {
  if (saberHumOsc) {
    saberHumOsc.stop();
    saberHumOsc = null;
    saberHumGain = null;
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  switch (type) {
    case 'swing': {
      // Lightsaber swing - wooshy, resonant
      const o = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o2.type = 'sine';
      o.frequency.setValueAtTime(180, now);
      o.frequency.exponentialRampToValueAtTime(500, now + 0.08);
      o.frequency.exponentialRampToValueAtTime(250, now + 0.2);
      o2.frequency.setValueAtTime(120, now);
      o2.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      o.connect(g); o2.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.25);
      o2.start(now); o2.stop(now + 0.25);
      // Add noise burst for whoosh
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < bufferSize; j++) data[j] = (Math.random() * 2 - 1) * 0.3;
      const noise = audioCtx.createBufferSource();
      const ng = audioCtx.createGain();
      const nf = audioCtx.createBiquadFilter();
      noise.buffer = buffer;
      nf.type = 'bandpass'; nf.frequency.value = 800; nf.Q.value = 1;
      ng.gain.setValueAtTime(0.08, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      noise.connect(nf); nf.connect(ng); ng.connect(masterGain);
      noise.start(now); noise.stop(now + 0.15);
      break;
    }
    case 'laser': {
      // Blaster bolt - classic pew pew
      const o = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o2.type = 'sine';
      o.frequency.setValueAtTime(1200, now);
      o.frequency.exponentialRampToValueAtTime(150, now + 0.2);
      o2.frequency.setValueAtTime(800, now);
      o2.frequency.exponentialRampToValueAtTime(100, now + 0.15);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      o.connect(g); o2.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.2);
      o2.start(now); o2.stop(now + 0.2);
      break;
    }
    case 'hit': {
      // Impact with bass thump
      const o = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(100, now);
      o.frequency.exponentialRampToValueAtTime(30, now + 0.25);
      o2.type = 'sawtooth';
      o2.frequency.setValueAtTime(200, now);
      o2.frequency.exponentialRampToValueAtTime(50, now + 0.15);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      o.connect(g); o2.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.25);
      o2.start(now); o2.stop(now + 0.25);
      break;
    }
    case 'jump': {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(300, now);
      o.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.12);
      break;
    }
    case 'bossDrone': {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(55, now);
      o.frequency.linearRampToValueAtTime(40, now + 2);
      g.gain.setValueAtTime(0.15, now);
      g.gain.linearRampToValueAtTime(0, now + 2);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 2);
      break;
    }
    case 'victory': {
      const notes = [523, 659, 784, 1047, 1319];
      notes.forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0, now + i * 0.2);
        g.gain.linearRampToValueAtTime(0.12, now + i * 0.2 + 0.05);
        g.gain.linearRampToValueAtTime(0, now + i * 0.2 + 0.4);
        o.connect(g); g.connect(masterGain);
        o.start(now + i * 0.2); o.stop(now + i * 0.2 + 0.4);
      });
      break;
    }
    case 'parry': {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(1200, now);
      o.frequency.exponentialRampToValueAtTime(2400, now + 0.05);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.1);
      break;
    }
    case 'forcePush': {
      const o = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const o3 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(200, now);
      o.frequency.exponentialRampToValueAtTime(40, now + 0.5);
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(400, now);
      o2.frequency.exponentialRampToValueAtTime(60, now + 0.4);
      o3.type = 'sawtooth';
      o3.frequency.setValueAtTime(80, now);
      o3.frequency.exponentialRampToValueAtTime(25, now + 0.6);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      o.connect(g); o2.connect(g); o3.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.6);
      o2.start(now); o2.stop(now + 0.5);
      o3.start(now); o3.stop(now + 0.6);
      const bufferSize = audioCtx.sampleRate * 0.3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < bufferSize; j++) data[j] = (Math.random() * 2 - 1) * 0.4;
      const noise = audioCtx.createBufferSource();
      const ng = audioCtx.createGain();
      const nf = audioCtx.createBiquadFilter();
      noise.buffer = buffer;
      nf.type = 'lowpass'; nf.frequency.setValueAtTime(2000, now); nf.frequency.exponentialRampToValueAtTime(100, now + 0.4);
      ng.gain.setValueAtTime(0.1, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      noise.connect(nf); nf.connect(ng); ng.connect(masterGain);
      noise.start(now); noise.stop(now + 0.4);
      break;
    }
    case 'forcePull': {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(60, now);
      o.frequency.exponentialRampToValueAtTime(300, now + 0.3);
      o.frequency.exponentialRampToValueAtTime(80, now + 0.5);
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.5);
      break;
    }
    case 'forceSpeed': {
      const o = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(400, now);
      o.frequency.linearRampToValueAtTime(800, now + 0.15);
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(600, now);
      o2.frequency.linearRampToValueAtTime(1200, now + 0.15);
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      o.connect(g); o2.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.3);
      o2.start(now); o2.stop(now + 0.3);
      break;
    }
    case 'pickup': {
      const notes = [523, 659, 784];
      notes.forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0, now + i * 0.08);
        g.gain.linearRampToValueAtTime(0.1, now + i * 0.08 + 0.02);
        g.gain.linearRampToValueAtTime(0, now + i * 0.08 + 0.15);
        o.connect(g); g.connect(masterGain);
        o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.15);
      });
      break;
    }
    case 'footstep': {
      const bufSize = audioCtx.sampleRate * 0.05;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < bufSize; j++) d[j] = (Math.random() * 2 - 1) * 0.2;
      const src = audioCtx.createBufferSource();
      const fg = audioCtx.createGain();
      const ff = audioCtx.createBiquadFilter();
      src.buffer = buf;
      ff.type = 'lowpass'; ff.frequency.value = 400;
      fg.gain.setValueAtTime(0.04, now);
      fg.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      src.connect(ff); ff.connect(fg); fg.connect(masterGain);
      src.start(now); src.stop(now + 0.05);
      break;
    }
    case 'vaderBreath': {
      // Inhale
      const bufSize = audioCtx.sampleRate * 0.8;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < bufSize; j++) d[j] = (Math.random() * 2 - 1);
      const src = audioCtx.createBufferSource();
      const fg = audioCtx.createGain();
      const ff = audioCtx.createBiquadFilter();
      src.buffer = buf;
      ff.type = 'bandpass'; ff.frequency.value = 200; ff.Q.value = 2;
      fg.gain.setValueAtTime(0.001, now);
      fg.gain.linearRampToValueAtTime(0.06, now + 0.3);
      fg.gain.linearRampToValueAtTime(0.001, now + 0.6);
      src.connect(ff); ff.connect(fg); fg.connect(masterGain);
      src.start(now); src.stop(now + 0.6);
      // Exhale
      const src2 = audioCtx.createBufferSource();
      const fg2 = audioCtx.createGain();
      const ff2 = audioCtx.createBiquadFilter();
      src2.buffer = buf;
      ff2.type = 'bandpass'; ff2.frequency.value = 150; ff2.Q.value = 3;
      fg2.gain.setValueAtTime(0.001, now + 0.7);
      fg2.gain.linearRampToValueAtTime(0.08, now + 1.0);
      fg2.gain.linearRampToValueAtTime(0.001, now + 1.5);
      src2.connect(ff2); ff2.connect(fg2); fg2.connect(masterGain);
      src2.start(now + 0.7); src2.stop(now + 1.5);
      break;
    }
    case 'explosion': {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(150, now);
      o.frequency.exponentialRampToValueAtTime(20, now + 0.5);
      g.gain.setValueAtTime(0.25, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.5);
      const bufSize2 = audioCtx.sampleRate * 0.4;
      const buf2 = audioCtx.createBuffer(1, bufSize2, audioCtx.sampleRate);
      const d2 = buf2.getChannelData(0);
      for (let j = 0; j < bufSize2; j++) d2[j] = (Math.random() * 2 - 1) * 0.5;
      const src2 = audioCtx.createBufferSource();
      const ng2 = audioCtx.createGain();
      src2.buffer = buf2;
      ng2.gain.setValueAtTime(0.15, now);
      ng2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      src2.connect(ng2); ng2.connect(masterGain);
      src2.start(now); src2.stop(now + 0.4);
      break;
    }
  }
}

// ============================================================
// TOUCH CONTROLS
// ============================================================
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const touchControls = document.getElementById('touch-controls');
const activeTouches = new Map(); // touchId -> button element

function pressButton(btn) {
  if (!btn || !btn.dataset.key) return;
  keys[btn.dataset.key] = true;
  btn.classList.add('active');
  haptic(15);
}

function releaseButton(btn) {
  if (!btn || !btn.dataset.key) return;
  keys[btn.dataset.key] = false;
  btn.classList.remove('active');
}

function releaseAllTouches() {
  activeTouches.forEach(btn => releaseButton(btn));
  activeTouches.clear();
}

// Haptic feedback helper
function haptic(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

if (isTouchDevice) {
  touchControls.style.display = 'block';
  document.body.style.touchAction = 'none';

  // Landscape orientation prompt
  const orientationPrompt = document.getElementById('orientation-prompt');
  function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth;
    orientationPrompt.style.display = isPortrait ? 'flex' : 'none';
  }
  checkOrientation();
  window.addEventListener('resize', checkOrientation);

  const touchButtons = document.querySelectorAll('#touch-controls .btn');

  touchButtons.forEach(btn => {
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        activeTouches.set(touch.identifier, btn);
        pressButton(btn);
      }
    }, { passive: false });
  });

  function handleTouchRelease(e) {
    for (const touch of e.changedTouches) {
      const btn = activeTouches.get(touch.identifier);
      if (btn) releaseButton(btn);
      activeTouches.delete(touch.identifier);
    }
  }

  document.addEventListener('touchmove', e => {
    for (const touch of e.changedTouches) {
      const oldBtn = activeTouches.get(touch.identifier);
      const newEl = document.elementFromPoint(touch.clientX, touch.clientY);
      const newBtn = newEl && newEl.closest('.btn');
      if (newBtn !== oldBtn) {
        if (oldBtn) releaseButton(oldBtn);
        if (newBtn && newBtn.dataset.key) {
          activeTouches.set(touch.identifier, newBtn);
          pressButton(newBtn);
        } else {
          activeTouches.delete(touch.identifier);
        }
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', handleTouchRelease, { passive: true });
  document.addEventListener('touchcancel', handleTouchRelease, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) releaseAllTouches();
  });

  // Pause button
  document.getElementById('btn-pause').addEventListener('touchstart', e => {
    e.preventDefault();
    if (gameState === 'playing') {
      paused = !paused;
      haptic(15);
    }
  }, { passive: false });

  // Tap on canvas to start/restart or unpause
  canvas.addEventListener('touchstart', e => {
    if (gameState === 'start' || gameState === 'gameover' || gameState === 'victory') {
      e.preventDefault();
      startOrRestartGame();
    }
  }, { passive: false });
}

// ============================================================
// PARTICLES
// ============================================================
let particles = [];

function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });
}

// ============================================================
// PROJECTILES
// ============================================================
let projectiles = [];

function spawnProjectile(x, y, vx, vy, damage, color, owner) {
  projectiles.push({ x, y, vx, vy, damage, color, owner, startX: x, alive: true });
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    // Remove if traveled too far or out of bounds
    if (Math.abs(p.x - p.startX) > 400 || p.x < 0 || p.x > LEVEL_WIDTH || p.y < 0 || p.y > H) {
      projectiles.splice(i, 1);
      continue;
    }
    // Check platform collision
    let removed = false;
    for (const plat of platforms) {
      if (plat.type === 'wall' && p.x > plat.x && p.x < plat.x + plat.w &&
          p.y > plat.y && p.y < plat.y + plat.h) {
        projectiles.splice(i, 1);
        removed = true;
        break;
      }
    }
    if (removed) continue;

    // Player-owned projectiles hit enemies and Vader
    if (p.owner === 'player') {
      const px1 = p.x - 6, px2 = p.x + 6, py1 = p.y - 2, py2 = p.y + 2;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!e.alive || e.dying) continue;
        if (px2 > e.x && px1 < e.x + e.w && py2 > e.y && py1 < e.y + e.h) {
          damageEnemy(e, p.damage);
          spawnParticles(p.x, p.y, '#66BB6A', 10, 4);
          playSound('hit');
          projectiles.splice(i, 1);
          removed = true;
          break;
        }
      }
      if (removed) continue;
      if (vader && vader.alive && !vader.dying) {
        if (px2 > vader.x && px1 < vader.x + vader.w && py2 > vader.y && py1 < vader.y + vader.h) {
          if (!vader.blocking) {
            damageVader(p.damage);
            spawnParticles(p.x, p.y, '#66BB6A', 10, 4);
          } else {
            spawnParticles(p.x, p.y, '#FF1744', 6, 3);
            playSound('parry');
          }
          projectiles.splice(i, 1);
          continue;
        }
      }
    }

    // Enemy projectiles should also stop on other enemies (not pass through)
    if (p.owner === 'enemy') {
      const px1 = p.x - 6, px2 = p.x + 6, py1 = p.y - 2, py2 = p.y + 2;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!e.alive || e.dying) continue;
        // Only block if projectile is moving toward the enemy (not fired by them)
        const ex = e.x + e.w / 2;
        const movingToward = (p.vx > 0 && p.x < ex) || (p.vx < 0 && p.x > ex);
        if (movingToward && px2 > e.x && px1 < e.x + e.w && py2 > e.y && py1 < e.y + e.h) {
          // Don't damage friendlies, just stop the bolt
          spawnParticles(p.x, p.y, '#FF1744', 4, 2);
          projectiles.splice(i, 1);
          removed = true;
          break;
        }
      }
      if (removed) continue;
    }
  }
}

function drawProjectiles() {
  projectiles.forEach(p => {
    const sx = p.x - camera.x;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(sx - 6, p.y - 2, 12, 4);
    ctx.shadowBlur = 0;
  });
}

let luke;

function updateLuke() {
  if (luke.dead) {
    luke.deathTimer--;
    if (luke.deathTimer <= 0) {
      luke.lives--;
      if (luke.lives <= 0) {
        gameState = 'gameover';
        gameEndTime = Date.now();
        stopSaberHum();
        stopImperialMarch();
        stopVaderBreathing();
        return;
      }
      luke.hp = luke.maxHp;
      luke.x = luke.checkpointX;
      luke.y = luke.checkpointY;
      luke.vx = 0;
      luke.vy = 0;
      luke.dead = false;
      luke.invincible = 60;
    }
    return;
  }

  // Combo timer
  if (luke.comboTimer > 0) {
    luke.comboTimer--;
    if (luke.comboTimer <= 0) { luke.combo = 0; luke.comboMultiplier = 1; }
  }

  // Force Speed
  if (luke.forceSpeedActive > 0) luke.forceSpeedActive--;
  const speedBoost = luke.forceSpeedActive > 0 ? 1.8 : 1;

  // Movement
  const speed = keys['KeyA'] ? 1.5 : 4 * speedBoost;
  if (keys['ArrowLeft']) {
    luke.vx = -speed;
    luke.facing = -1;
  } else if (keys['ArrowRight']) {
    luke.vx = speed;
    luke.facing = 1;
  } else {
    luke.vx *= FRICTION;
    if (Math.abs(luke.vx) < 0.1) luke.vx = 0;
  }

  // Walk animation
  if (Math.abs(luke.vx) > 0.5 && luke.onGround) {
    luke.walkTimer += Math.abs(luke.vx) * 0.15;
    luke.walkFrame = Math.floor(luke.walkTimer) % 4;
    // Footstep sounds
    footstepTimer--;
    if (footstepTimer <= 0) {
      playSound('footstep');
      footstepTimer = Math.floor(12 / speedBoost);
    }
  } else {
    luke.walkFrame = 0;
    luke.walkTimer = 0;
  }

  // Jump
  if ((keys['Space'] || keys['ArrowUp']) && luke.jumps < luke.maxJumps) {
    if (!luke._jumpPressed) {
      luke.vy = -11;
      luke.jumps++;
      luke._jumpPressed = true;
      playSound('jump');
    }
  }
  if (!keys['Space'] && !keys['ArrowUp']) luke._jumpPressed = false;

  // Attack
  if (keys['KeyZ'] && !luke.attacking && luke.attackCooldown <= 0) {
    luke.attacking = true;
    luke.attackTimer = 12;
    luke.attackCooldown = 18;
    playSound('swing');
  }
  if (luke.attacking) {
    luke.attackTimer--;
    if (luke.attackTimer <= 0) luke.attacking = false;
  }
  if (luke.attackCooldown > 0) luke.attackCooldown--;

  // Force push (X)
  if (keys['KeyX'] && luke.forcePushCooldown <= 0) {
    luke.forcePushCooldown = luke.forcePushMaxCooldown;
    performForcePush();
  }
  if (luke.forcePushCooldown > 0) luke.forcePushCooldown--;

  // Force pull (C) - pulls enemies toward Luke
  if (keys['KeyC'] && luke.forcePullCooldown <= 0) {
    luke.forcePullCooldown = luke.forcePullMaxCooldown;
    performForcePull();
  }
  if (luke.forcePullCooldown > 0) luke.forcePullCooldown--;

  // Force speed (S) - temporary speed boost
  if (keys['KeyS'] && luke.forceSpeedCooldown <= 0) {
    luke.forceSpeedCooldown = luke.forceSpeedMaxCooldown;
    luke.forceSpeedActive = 180; // 3 seconds
    playSound('forceSpeed');
    spawnParticles(luke.x + luke.w/2, luke.y + luke.h/2, '#7B1FA2', 15, 4);
  }
  if (luke.forceSpeedCooldown > 0) luke.forceSpeedCooldown--;

  // Block
  luke.blocking = !!keys['KeyA'] && !luke.attacking;

  // Physics
  luke.vy += GRAVITY;
  luke.x += luke.vx;
  luke.y += luke.vy;

  // Platform collision
  luke.onGround = false;
  for (const plat of platforms) {
    if (plat.type === 'wall') {
      // Horizontal wall collision
      if (luke.y + luke.h > plat.y && luke.y < plat.y + plat.h) {
        if (luke.x + luke.w > plat.x && luke.x < plat.x + plat.w) {
          if (luke.vx > 0) luke.x = plat.x - luke.w;
          else if (luke.vx < 0) luke.x = plat.x + plat.w;
          luke.vx = 0;
        }
      }
      continue;
    }
    // Ground/platform collision (only from above)
    if (luke.vy >= 0 &&
        luke.x + luke.w > plat.x && luke.x < plat.x + plat.w &&
        luke.y + luke.h > plat.y && luke.y + luke.h < plat.y + plat.h + luke.vy + 2) {
      luke.y = plat.y - luke.h;
      luke.vy = 0;
      luke.onGround = true;
      luke.jumps = 0;
    }
  }

  // Level boundaries
  if (luke.x < 0) luke.x = 0;
  if (luke.x + luke.w > LEVEL_WIDTH) luke.x = LEVEL_WIDTH - luke.w;
  if (luke.y > H) {
    damageLuke(100);
  }

  // Invincibility
  if (luke.invincible > 0) luke.invincible--;

  // Idle bob
  luke.idleTimer += 0.05;

  // Camera
  camera.x = luke.x - W / 3;
  if (camera.x < 0) camera.x = 0;
  if (camera.x > LEVEL_WIDTH - W) camera.x = LEVEL_WIDTH - W;

  // Checkpoints
  checkpoints.forEach((cp, i) => {
    if (!cp.triggered && luke.x > cp.x) {
      cp.triggered = true;
      luke.checkpointX = luke.x;
      luke.checkpointY = luke.y;
      checkpointText = { text: 'CHECKPOINT', timer: 120 };
    }
  });

  // Attack hitbox check
  if (luke.attacking && luke.attackTimer === 10) {
    const hx = luke.facing === 1 ? luke.x + luke.w : luke.x - 70;
    const hy = luke.y;
    const hw = 70, hh = luke.h;
    enemies.forEach(e => {
      if (e.alive && rectsOverlap(hx, hy, hw, hh, e.x, e.y, e.w, e.h)) {
        damageEnemy(e, 25);
      }
    });
    // Boss
    if (vader && vader.alive && !vader.blocking) {
      if (rectsOverlap(hx, hy, hw, hh, vader.x, vader.y, vader.w, vader.h)) {
        damageVader(25);
      }
    }
  }

  // Projectile collision with Luke
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.owner === 'player') continue;
    if (luke.x < p.x + 6 && luke.x + luke.w > p.x - 6 &&
        luke.y < p.y + 2 && luke.y + luke.h > p.y - 2) {
      // Parry check (attack swing)
      if (luke.attacking && luke.attackTimer > 6) {
        projectiles.splice(i, 1);
        spawnParticles(p.x, p.y, '#FFF', 8, 3);
        playSound('parry');
      // Block check (A key)
      } else if (luke.blocking) {
        p.vx = -p.vx * 1.2;
        p.vy = (Math.random() - 0.5) * 0.5;
        p.owner = 'player';
        p.startX = p.x;
        p.damage = Math.floor(p.damage * 1.5);
        p.color = '#66BB6A';
        spawnParticles(p.x, p.y, '#66BB6A', 6, 3);
        playSound('parry');
        screenShake = 3;
        screenShakeIntensity = 2;
      } else {
        damageLuke(p.damage);
        projectiles.splice(i, 1);
      }
    }
  }

  // Enemy contact damage
  enemies.forEach(e => {
    if (e.alive && rectsOverlap(luke.x, luke.y, luke.w, luke.h, e.x, e.y, e.w, e.h)) {
      damageLuke(e.contactDamage);
    }
  });

  // Boss contact
  if (vader && vader.alive && vader.dashing) {
    if (rectsOverlap(luke.x, luke.y, luke.w, luke.h, vader.x, vader.y, vader.w, vader.h)) {
      damageLuke(25);
    }
  }

  // Section tracking for no-damage bonus
  const section = luke.x < 2500 ? 0 : luke.x < 5000 ? 1 : luke.x < 7000 ? 2 : luke.x < 9500 ? 3 : luke.x < 10500 ? 4 : 5;
  luke.currentSection = section;
}

function damageLuke(amount) {
  if (luke.invincible > 0 || luke.dead) return;
  // Shield absorbs damage first
  if (luke.shield > 0) {
    const absorbed = Math.min(luke.shield, amount);
    luke.shield -= absorbed;
    amount -= absorbed;
    spawnParticles(luke.x + luke.w/2, luke.y + luke.h/2, '#2196F3', 4, 2);
  }
  luke.hp -= amount;
  luke.invincible = 30;
  damageFlash = 10;
  screenShake = 8;
  screenShakeIntensity = 4;
  playSound('hit');
  haptic([50, 30, 80]);
  // Track section damage
  const section = luke.x < 2500 ? 0 : luke.x < 5000 ? 1 : luke.x < 7000 ? 2 : luke.x < 9500 ? 3 : luke.x < 10500 ? 4 : 5;
  if (section < luke.sectionDamage.length) luke.sectionDamage[section] = true;

  if (luke.hp <= 0) {
    luke.hp = 0;
    luke.dead = true;
    luke.deathTimer = 60;
  }
}

function performForcePush() {
  playSound('forcePush');
  const cx = luke.x + luke.w / 2;
  const cy = luke.y + luke.h / 2;
  const radius = 120;
  spawnParticles(cx, cy, '#66BB6A', 20, 5);

  enemies.forEach(e => {
    if (!e.alive) return;
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    const dist = Math.hypot(ex - cx, ey - cy);
    if (dist < radius) {
      const dir = ex > cx ? 1 : -1;
      e.x += dir * 60;
      e.stunTimer = 60;
    }
  });

  if (vader && vader.alive && !vader.blocking) {
    const vx = vader.x + vader.w / 2, vy = vader.y + vader.h / 2;
    if (Math.hypot(vx - cx, vy - cy) < radius) {
      const dir = vx > cx ? 1 : -1;
      vader.x += dir * 60;
      vader.stunTimer = 60;
    }
  }

  // Remove nearby projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.owner !== 'player' && Math.hypot(p.x - cx, p.y - cy) < radius) {
      projectiles.splice(i, 1);
    }
  }
}

function performForcePull() {
  playSound('forcePull');
  const cx = luke.x + luke.w / 2;
  const cy = luke.y + luke.h / 2;
  const radius = 200;
  spawnParticles(cx, cy, '#7B1FA2', 15, 4);

  enemies.forEach(e => {
    if (!e.alive || e.dying) return;
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    const dist = Math.hypot(ex - cx, ey - cy);
    if (dist < radius) {
      const dir = ex > cx ? -1 : 1;
      e.x += dir * 50;
      e.stunTimer = 45;
      damageEnemy(e, 10);
    }
  });

  if (vader && vader.alive && !vader.blocking) {
    const vx = vader.x + vader.w / 2, vy = vader.y + vader.h / 2;
    if (Math.hypot(vx - cx, vy - cy) < radius) {
      const dir = vx > cx ? -1 : 1;
      vader.x += dir * 30;
      vader.stunTimer = 30;
    }
  }
}

function drawLuke() {
  if (luke.dead && luke.deathTimer > 0) return;
  if (luke.invincible > 0 && Math.floor(luke.invincible / 3) % 2 === 0) return;

  const sx = luke.x - camera.x;
  const bob = luke.vx === 0 && luke.onGround ? Math.sin(luke.idleTimer) * 2 : 0;
  const sy = luke.y + bob;
  const f = luke.facing;

  ctx.save();
  ctx.translate(sx + luke.w / 2, sy);

  // Force speed trail
  if (luke.forceSpeedActive > 0) {
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#FF6D00';
    ctx.fillRect(-luke.facing * 8, 0, 28, luke.h);
    ctx.fillRect(-luke.facing * 16, 5, 28, luke.h - 10);
    ctx.globalAlpha = 1;
  }

  // Walk animation offsets
  const wf = luke.walkFrame;
  const legOff1 = [0, 3, 0, -3][wf];
  const legOff2 = [0, -3, 0, 3][wf];

  // Boots
  ctx.fillStyle = '#3E2723';
  ctx.fillRect(-10, luke.h - 10 + legOff1, 8, 10);
  ctx.fillRect(2, luke.h - 10 + legOff2, 8, 10);

  // Legs
  ctx.fillStyle = '#D7CCC8';
  ctx.fillRect(-9, luke.h - 22 + legOff1, 8, 14);
  ctx.fillRect(1, luke.h - 22 + legOff2, 8, 14);

  // Body (tunic)
  ctx.fillStyle = '#D7CCC8';
  ctx.fillRect(-12, 12, 24, 18);

  // Belt
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(-12, 26, 24, 4);

  // Head
  ctx.fillStyle = '#FFCCBC';
  ctx.fillRect(-7, 0, 14, 14);

  // Hair
  ctx.fillStyle = '#8D6E63';
  ctx.fillRect(-8, -1, 16, 6);

  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(-4, 5, 3, 3);
  ctx.fillRect(1, 5, 3, 3);
  // Eye whites
  ctx.fillStyle = '#FFF';
  ctx.fillRect(-4, 5, 2, 2);
  ctx.fillRect(1, 5, 2, 2);
  // Eyebrows
  ctx.fillStyle = '#6D4C41';
  ctx.fillRect(-5, 3, 4, 1);
  ctx.fillRect(1, 3, 4, 1);

  // Nose
  ctx.fillStyle = '#E8B89D';
  ctx.fillRect(-1, 7, 2, 2);

  // Mouth
  ctx.fillStyle = '#C97060';
  ctx.fillRect(-3, 10, 6, 2);
  // Upper lip line
  ctx.fillStyle = '#B05050';
  ctx.fillRect(-3, 10, 6, 1);
  // Lower lip highlight
  ctx.fillStyle = '#D08878';
  ctx.fillRect(-2, 11, 4, 1);

  // Lightsaber with enhanced glow
  const saberGlow = luke.attacking ? 1 : 0.6;
  const saberLen = luke.attacking ? 45 : 35;
  ctx.save();
  // Multi-layer glow effect
  ctx.shadowColor = '#66BB6A';
  ctx.shadowBlur = luke.attacking ? 30 : 15;
  // Ambient light on Luke
  ctx.fillStyle = 'rgba(102, 187, 106, 0.05)';
  ctx.fillRect(-14, 0, 28, luke.h);
  ctx.fillStyle = '#66BB6A';

  // Handle
  ctx.fillStyle = '#888';
  const hx = f === 1 ? 10 : -14;
  ctx.fillRect(hx, 14, 4, 10);

  // Blade
  ctx.globalAlpha = saberGlow;
  ctx.fillStyle = '#66BB6A';
  if (luke.blocking) {
    // Blocking stance - saber held horizontally across body
    ctx.globalAlpha = 0.9;
    ctx.fillRect(-16, 10, 32, 4);
    // Shield glow effect
    ctx.globalAlpha = 0.15 + Math.sin(Date.now() / 100) * 0.08;
    ctx.fillStyle = '#66BB6A';
    ctx.beginPath();
    ctx.arc(0, luke.h / 2, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if (luke.attacking) {
    // Slash animation
    const angle = (1 - luke.attackTimer / 12) * Math.PI * 0.5 - Math.PI * 0.25;
    ctx.save();
    ctx.translate(hx + 2, 14);
    ctx.rotate(f === 1 ? angle : -angle);
    ctx.fillRect(-2, -saberLen, 4, saberLen);
    // Trail
    ctx.globalAlpha = 0.3;
    ctx.fillRect(-4, -saberLen, 8, saberLen);
    ctx.restore();
  } else {
    ctx.fillRect(hx, 14 - saberLen, 4, saberLen);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.restore();
}

function damageEnemy(e, amount) {
  if (!e.alive || e.dying) return;
  e.hp -= amount;
  e.flashTimer = 8;
  e.hitFlashWhite = 4;
  playSound('hit');
  spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#FFF', 6, 3);

  // Knockback
  const dir = e.x > luke.x ? 1 : -1;
  e.x += dir * 20;

  // Combo system
  luke.combo++;
  luke.comboTimer = 90;
  luke.comboMultiplier = Math.min(4, 1 + Math.floor(luke.combo / 3));

  if (e.hp <= 0) {
    e.dying = true;
    e.deathTimer = 45;
    e.deathRotation = 0;
    e.deathVy = -3;
    e.deathVx = (e.x > luke.x ? 1 : -1) * (2 + Math.random() * 2);
    score += e.points * luke.comboMultiplier;
    haptic(30);
    // Death particles per type
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    if (e.type === 'atst') {
      playSound('explosion');
      spawnParticles(cx, cy, '#FF6D00', 30, 6);
      spawnParticles(cx, cy, '#FFF', 15, 5);
      screenShake = 20;
      screenShakeIntensity = 8;
    } else if (e.type === 'probe') {
      playSound('explosion');
      spawnParticles(cx, cy, '#FF6D00', 15, 4);
      spawnParticles(cx, cy, '#888', 8, 3);
      screenShake = 5;
      screenShakeIntensity = 3;
    } else {
      spawnParticles(cx, cy, '#FFF', 8, 3);
      spawnParticles(cx, cy, '#888', 5, 2);
    }
  }
}

function updateEnemies() {
  enemies.forEach(e => {
    if (!e.alive) return;
    if (e.dying) {
      e.deathTimer--;
      // Physics-based death animation
      if (e.type !== 'turret') {
        e.deathVy = (e.deathVy || 0) + 0.4;
        e.x += (e.deathVx || 0);
        e.y += e.deathVy;
        e.deathRotation = (e.deathRotation || 0) + (e.deathVx > 0 ? 0.1 : -0.1);
      }
      // Disintegration particles in final frames
      if (e.deathTimer === 15 || e.deathTimer === 8) {
        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#888', 4, 2);
      }
      if (e.deathTimer <= 0) e.alive = false;
      return;
    }
    if (e.stunTimer > 0) { e.stunTimer--; return; }

    if (e.type === 'stormtrooper') {
      // Patrol
      e.x += e.speed * e.facing;
      if (e.x <= e.patrolMin) e.facing = 1;
      if (e.x + e.w >= e.patrolMax) e.facing = -1;

      // Face Luke if nearby
      const dist = Math.abs(luke.x - e.x);
      if (dist < 400) {
        e.facing = luke.x > e.x ? 1 : -1;
      }

      // Fire
      if (dist < 300 && !luke.dead) {
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          e.fireTimer = e.fireCooldown;
          const dir = luke.x > e.x ? 1 : -1;
          spawnProjectile(e.x + e.w / 2 + dir * 15, e.y + 20, dir * 5, 0, 10, '#FF1744', 'enemy');
          playSound('laser');
        }
      }
    } else if (e.type === 'turret') {
      e.facing = luke.x > e.x ? 1 : -1;
      const dist = Math.abs(luke.x - e.x);
      if (dist < 500 && !luke.dead) {
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          e.fireTimer = e.fireCooldown;
          const dir = e.facing;
          spawnProjectile(e.x + e.w / 2 + dir * 20, e.y + 10, dir * 6, 0, 10, '#FF1744', 'enemy');
          playSound('laser');
        }
      }
    } else if (e.type === 'scout') {
      // Fast melee - charges at Luke
      const dist = Math.abs(luke.x - e.x);
      if (dist < 300) {
        e.facing = luke.x > e.x ? 1 : -1;
        e.x += e.speed * e.facing * 1.5;
      } else {
        e.x += e.speed * e.facing;
        if (e.x <= e.patrolMin) e.facing = 1;
        if (e.x + e.w >= e.patrolMax) e.facing = -1;
      }
      if (dist < 200 && !luke.dead) {
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          e.fireTimer = e.fireCooldown;
          const dir = luke.x > e.x ? 1 : -1;
          spawnProjectile(e.x + e.w/2 + dir*10, e.y + 15, dir * 6, 0, 8, '#FF6D00', 'enemy');
          playSound('laser');
        }
      }
    } else if (e.type === 'officer') {
      e.facing = luke.x > e.x ? 1 : -1;
      // Buff nearby troops
      e.buffTimer--;
      if (e.buffTimer <= 0) {
        e.buffTimer = e.buffCooldown;
        enemies.forEach(other => {
          if (other === e || !other.alive || other.dying) return;
          if (Math.abs(other.x - e.x) < 200) {
            other.fireCooldown = Math.max(40, other.fireCooldown - 20);
            spawnParticles(other.x + other.w/2, other.y, '#FFD700', 4, 2);
          }
        });
        spawnParticles(e.x + e.w/2, e.y + e.h/2, '#FFD700', 8, 3);
      }
    } else if (e.type === 'probe') {
      e.facing = luke.x > e.x ? 1 : -1;
      e.bobPhase += 0.03;
      e.y = e.baseY + Math.sin(e.bobPhase) * 20;
      const dist = Math.abs(luke.x - e.x);
      if (dist < 350) {
        e.x += (luke.x > e.x ? 1 : -1) * e.speed * 0.5;
      }
      if (dist < 300 && !luke.dead) {
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          e.fireTimer = e.fireCooldown;
          const dx = luke.x - e.x, dy = luke.y - e.y;
          const len = Math.hypot(dx, dy);
          spawnProjectile(e.x + e.w/2, e.y + e.h/2, (dx/len)*4, (dy/len)*4, 12, '#FF1744', 'enemy');
          playSound('laser');
        }
      }
    } else if (e.type === 'atst') {
      e.facing = luke.x > e.x ? 1 : -1;
      e.walkTimer += 0.05;
      e.walkFrame = Math.floor(e.walkTimer) % 2;
      const dist = Math.abs(luke.x - e.x);
      // Slowly advance
      if (dist < 500 && dist > 80) {
        e.x += e.speed * e.facing;
      }
      if (dist < 400 && !luke.dead) {
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          e.fireTimer = e.fireCooldown;
          const dir = e.facing;
          // Double shot
          spawnProjectile(e.x + e.w/2 + dir*30, e.y + 15, dir * 5, -1, 15, '#FF6D00', 'enemy');
          spawnProjectile(e.x + e.w/2 + dir*30, e.y + 25, dir * 5, 1, 15, '#FF6D00', 'enemy');
          playSound('laser');
          screenShake = 3;
          screenShakeIntensity = 2;
        }
      }
    }

    // Hit flash decay
    if (e.hitFlashWhite > 0) e.hitFlashWhite--;
  });
}

function drawEnemies() {
  enemies.forEach(e => {
    if (!e.alive) return;
    const sx = e.x - camera.x;

    if (e.dying) {
      ctx.globalAlpha = Math.min(1, e.deathTimer / 20);
      // Red tint flash on death
      if (e.deathTimer > 30 && Math.floor(e.deathTimer / 2) % 2 === 0) {
        ctx.globalAlpha *= 0.6;
      }
    }
    if (e.flashTimer > 0) {
      e.flashTimer--;
      ctx.globalAlpha = (Math.floor(e.flashTimer / 2) % 2 === 0) ? 1 : 0.5;
    }

    // White flash on hit
    if (e.hitFlashWhite > 0) {
      ctx.globalCompositeOperation = 'source-atop';
    }

    // Apply rotation for dying enemies
    if (e.dying && e.type !== 'turret') {
      ctx.save();
      ctx.translate(sx + e.w / 2, e.y + e.h / 2);
      ctx.rotate(e.deathRotation || 0);
      ctx.translate(-(sx + e.w / 2), -(e.y + e.h / 2));
    }

    if (e.type === 'stormtrooper') {
      drawStormtrooper(sx, e.y, e.facing, e.stunTimer > 0);
    } else if (e.type === 'turret') {
      drawTurret(sx, e.y, e.facing);
    } else if (e.type === 'scout') {
      drawScoutTrooper(sx, e.y, e.facing, e.stunTimer > 0);
    } else if (e.type === 'officer') {
      drawImperialOfficer(sx, e.y, e.facing);
    } else if (e.type === 'probe') {
      drawProbeDroid(sx, e.y, e.facing);
    } else if (e.type === 'atst') {
      drawATST(sx, e.y, e.facing, e.walkFrame);
    }

    if (e.dying && e.type !== 'turret') {
      ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // Enemy HP bar for tough enemies
    if ((e.type === 'atst' || e.type === 'officer') && e.hp < e.maxHp && !e.dying) {
      const barW = e.w;
      const barX = sx + (e.type === 'stormtrooper' || e.type === 'scout' ? 0 : 0);
      ctx.fillStyle = '#333';
      ctx.fillRect(sx, e.y - 8, barW, 4);
      ctx.fillStyle = '#F44336';
      ctx.fillRect(sx, e.y - 8, barW * (e.hp / e.maxHp), 4);
    }
  });
}

// ============================================================
// DARTH VADER (BOSS)
// ============================================================
let vader = null;

function createVader() {
  return {
    x: 12500, y: H - 105, w: 36, h: 65,
    hp: 300, maxHp: 300,
    alive: true,
    phase: 1,
    state: 'idle',
    stateTimer: 120,
    facing: -1,
    blocking: false,
    dashing: false,
    dashVx: 0,
    attackHitbox: false,
    stunTimer: 0,
    flashTimer: 0,
    deathTimer: 0,
    dying: false,
    entranceDone: false
  };
}

function damageVader(amount) {
  if (!vader || !vader.alive || vader.dying || vader.blocking) return;
  vader.hp -= amount;
  vader.flashTimer = 8;
  spawnParticles(vader.x + vader.w / 2, vader.y + vader.h / 2, '#FF1744', 8, 4);
  playSound('hit');
  screenShake = 6;
  screenShakeIntensity = 3;

  if (vader.hp <= 150 && vader.phase === 1) {
    vader.phase = 2;
  }

  if (vader.hp <= 0) {
    vader.hp = 0;
    vader.dying = true;
    vader.deathTimer = 120;
    score += 500;
  }
}

function updateVader() {
  if (!vader || !vader.alive) return;

  if (vader.dying) {
    vader.deathTimer--;
    if (vader.deathTimer <= 0) {
      vader.alive = false;
      gameState = 'victory';
      gameEndTime = Date.now();
      playSound('victory');
      stopSaberHum();
      stopImperialMarch();
      stopVaderBreathing();
      // Section bonuses
      luke.sectionDamage.forEach((damaged, i) => {
        if (!damaged) score += 50;
      });
      // Time bonus
      const timeSec = (gameEndTime - gameStartTime) / 1000;
      score += Math.max(0, Math.floor(600 - timeSec));
    }
    return;
  }

  if (vader.stunTimer > 0) { vader.stunTimer--; return; }

  vader.facing = luke.x < vader.x ? -1 : 1;

  if (vader.dashing) {
    vader.x += vader.dashVx;
    vader.stateTimer--;
    if (vader.stateTimer <= 0) {
      vader.dashing = false;
      vader.state = 'idle';
      vader.stateTimer = 60;
    }
    return;
  }

  vader.stateTimer--;
  if (vader.stateTimer <= 0) {
    vader.blocking = false;
    vader.attackHitbox = false;
    vader.dashing = false;
    chooseVaderAction();
  }

  // Melee hit check
  if (vader.attackHitbox) {
    const hx = vader.facing === 1 ? vader.x + vader.w : vader.x - 80;
    if (rectsOverlap(hx, vader.y, 80, vader.h, luke.x, luke.y, luke.w, luke.h)) {
      // Parry check
      if (luke.attacking && luke.attackTimer > 6) {
        vader.attackHitbox = false;
        spawnParticles(luke.x + luke.w / 2, luke.y + 10, '#FFF', 12, 4);
        playSound('parry');
        screenShake = 6;
        screenShakeIntensity = 3;
      } else if (luke.blocking) {
        vader.attackHitbox = false;
        spawnParticles(luke.x + luke.w / 2, luke.y + 10, '#66BB6A', 8, 3);
        playSound('parry');
        damageLuke(10);
        screenShake = 4;
        screenShakeIntensity = 2;
      } else {
        damageLuke(30);
        vader.attackHitbox = false;
      }
    }
  }
}

function chooseVaderAction() {
  const actions = ['advance', 'forceThrow', 'block'];
  if (vader.phase === 2) {
    actions.push('dash', 'saberThrow');
  }
  const action = actions[Math.floor(Math.random() * actions.length)];

  switch (action) {
    case 'advance':
      vader.state = 'advance';
      vader.stateTimer = 90;
      const advanceInterval = setInterval(() => {
        if (!vader || !vader.alive || vader.state !== 'advance') {
          clearInterval(advanceInterval);
          return;
        }
        const dir = luke.x > vader.x ? 1 : -1;
        vader.x += dir * 2;
        const dist = Math.abs(luke.x - vader.x);
        if (dist < 80) {
          vader.attackHitbox = true;
          playSound('swing');
          setTimeout(() => { if (vader) vader.attackHitbox = false; }, 200);
          clearInterval(advanceInterval);
        }
      }, 16);
      break;
    case 'forceThrow':
      vader.state = 'forceThrow';
      vader.stateTimer = 60;
      const dir2 = vader.facing;
      spawnProjectile(vader.x + vader.w / 2, vader.y + 20, dir2 * 4, 0, 20, '#999', 'enemy');
      break;
    case 'block':
      vader.state = 'block';
      vader.blocking = true;
      vader.stateTimer = 90;
      break;
    case 'dash':
      vader.state = 'dash';
      vader.dashing = true;
      vader.dashVx = vader.facing * 8;
      vader.stateTimer = 30;
      break;
    case 'saberThrow':
      vader.state = 'saberThrow';
      vader.stateTimer = 60;
      const dir3 = vader.facing;
      spawnProjectile(vader.x + vader.w / 2, vader.y + 10, dir3 * 5, -2, 20, '#FF1744', 'enemy');
      spawnProjectile(vader.x + vader.w / 2, vader.y + 30, dir3 * 5, 2, 20, '#FF1744', 'enemy');
      break;
  }
}

  ctx.moveTo(-14, 10);
  ctx.lineTo(-14, 2);
  ctx.quadraticCurveTo(-14, -8, 0, -8);
  ctx.quadraticCurveTo(14, -8, 14, 2);
  ctx.lineTo(14, 10);
  ctx.closePath();
  ctx.fill();

  // Face plate / mask area
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(-11, 10);
  ctx.lineTo(-11, 2);
  ctx.quadraticCurveTo(-11, -4, 0, -4);
  ctx.quadraticCurveTo(11, -4, 11, 2);
  ctx.lineTo(11, 10);
  ctx.closePath();
  ctx.fill();

  // Brow ridge - angular, menacing
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(-12, 2);
  ctx.lineTo(-8, 0);
  ctx.lineTo(0, 1);
  ctx.lineTo(8, 0);
  ctx.lineTo(12, 2);
  ctx.lineTo(12, 4);
  ctx.lineTo(-12, 4);
  ctx.closePath();
  ctx.fill();

  // Eye lenses - triangular, dark with red glow
  ctx.fillStyle = '#1c1c1c';
  ctx.beginPath();
  ctx.moveTo(-9, 3);
  ctx.lineTo(-3, 3);
  ctx.lineTo(-3, 6);
  ctx.lineTo(-9, 5);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(9, 3);
  ctx.lineTo(3, 3);
  ctx.lineTo(3, 6);
  ctx.lineTo(9, 5);
  ctx.closePath();
  ctx.fill();
  // Eye glow
  ctx.fillStyle = '#FF1744';
  ctx.shadowColor = '#FF1744';
  ctx.shadowBlur = 4;
  ctx.fillRect(-8, 4, 4, 1);
  ctx.fillRect(4, 4, 4, 1);
  ctx.shadowBlur = 0;

  // Nose ridge - triangular
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(-2, 5);
  ctx.lineTo(0, 3);
  ctx.lineTo(2, 5);
  ctx.lineTo(2, 7);
  ctx.lineTo(-2, 7);
  ctx.closePath();
  ctx.fill();

  // Mouth grille / respirator - the iconic triangular vent
  ctx.fillStyle = '#181818';
  ctx.beginPath();
  ctx.moveTo(-7, 7);
  ctx.lineTo(7, 7);
  ctx.lineTo(5, 12);
  ctx.lineTo(-5, 12);
  ctx.closePath();
  ctx.fill();
  // Grille lines
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.8;
  for (let gi = 0; gi < 4; gi++) {
    const gy = 8 + gi * 1.2;
    const gw = 6 - gi * 0.5;
    ctx.beginPath();
    ctx.moveTo(-gw, gy);
    ctx.lineTo(gw, gy);
    ctx.stroke();
  }

  // Helmet side tubes / cheek vents
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-13, 5, 3, 6);
  ctx.fillRect(10, 5, 3, 6);

  // Lightsaber
  if (!vader.dying || vader.deathTimer > 60) {
    const f = vader.facing;
    ctx.fillStyle = '#555';
    const hx = f === 1 ? 14 : -20;
    ctx.fillRect(hx, 14, 6, 12);

    ctx.fillStyle = '#FF1744';
    ctx.shadowColor = '#FF1744';
    ctx.shadowBlur = vader.state === 'advance' ? 25 : 15;
    if (vader.blocking) {
      // Blocking stance - saber across
      ctx.fillRect(-18, 8, 36, 4);
    } else {
      ctx.fillRect(hx + 1, 14 - 42, 4, 42);
    }
    ctx.shadowBlur = 0;
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

// ============================================================
// LEVEL RENDERING
// ============================================================
function drawBackground() {
  // Black background
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // Star layers (visible through windows)
  const speeds = [0.1, 0.2, 0.4];
  const colors = ['#668', '#99b', '#ddf'];
  for (let layer = 0; layer < 3; layer++) {
    ctx.fillStyle = colors[layer];
    stars[layer].forEach(s => {
      const sx = (s.x - camera.x * speeds[layer]) % W;
      const x = sx < 0 ? sx + W : sx;
      ctx.globalAlpha = s.brightness * (0.7 + Math.sin(Date.now() / 1000 + s.x) * 0.3);
      ctx.fillRect(x, s.y, s.size, s.size);
    });
  }
  ctx.globalAlpha = 1;

  // Death Star interior - walls and ceiling
  const wallOffset = camera.x * 0.4;

  // Ceiling
  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillStyle = '#222230';
  ctx.fillRect(0, 28, W, 3);

  // Ceiling panels
  ctx.fillStyle = '#161620';
  for (let i = 0; i < 20; i++) {
    const px = i * 120 - wallOffset % 120;
    ctx.fillRect(px, 0, 118, 28);
    ctx.strokeStyle = '#252530';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, 0, 118, 28);
    // Ceiling lights
    ctx.fillStyle = '#334';
    ctx.fillRect(px + 40, 20, 38, 6);
    ctx.fillStyle = '#556';
    ctx.globalAlpha = 0.5 + Math.sin(Date.now()/1000 + i) * 0.2;
    ctx.fillRect(px + 42, 22, 34, 3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#161620';
  }

  // Back wall structures (parallax layer)
  const structOffset = camera.x * 0.3;
  ctx.fillStyle = '#161622';
  for (let i = 0; i < 25; i++) {
    const bx = i * 400 - structOffset % 400;
    const bh = 60 + (i * 37) % 80;
    ctx.fillRect(bx, H - 40 - bh, 80 + (i * 23) % 60, bh);

    // Control panels on walls
    if (i % 3 === 0) {
      ctx.fillStyle = '#1e1e28';
      ctx.fillRect(bx + 10, H - 40 - bh + 10, 40, 30);
      // Screen
      ctx.fillStyle = '#112211';
      ctx.fillRect(bx + 14, H - 40 - bh + 14, 32, 18);
      // Blinking lights
      const t = Date.now() / 500;
      ctx.fillStyle = Math.sin(t + i) > 0 ? '#4CAF50' : '#333';
      ctx.fillRect(bx + 16, H - 40 - bh + 34, 4, 4);
      ctx.fillStyle = Math.sin(t + i + 1) > 0 ? '#F44336' : '#333';
      ctx.fillRect(bx + 22, H - 40 - bh + 34, 4, 4);
      ctx.fillStyle = Math.sin(t + i + 2) > 0 ? '#2196F3' : '#333';
      ctx.fillRect(bx + 28, H - 40 - bh + 34, 4, 4);
      ctx.fillStyle = '#161622';
    }

    // Pipes
    if (i % 4 === 1) {
      ctx.fillStyle = '#222233';
      ctx.fillRect(bx + 5, 30, 6, H - 70 - bh);
      ctx.fillRect(bx + 15, 30, 4, H - 70 - bh);
      ctx.fillStyle = '#161622';
    }

    // Windows showing space
    if (i % 5 === 2) {
      ctx.fillStyle = '#0a0a18';
      ctx.fillRect(bx + 20, 35, 50, 35);
      ctx.strokeStyle = '#333340';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx + 20, 35, 50, 35);
      // Window divider
      ctx.fillStyle = '#333340';
      ctx.fillRect(bx + 44, 35, 2, 35);
    }
  }

  // Red accent lights on floor edge
  ctx.fillStyle = '#FF1744';
  ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 500) * 0.1;
  for (let i = 0; i < 25; i++) {
    const lx = i * 400 - camera.x * 0.5;
    if (lx > -20 && lx < W + 20) {
      ctx.fillRect(lx % W, H - 45, 3, 6);
    }
  }
  ctx.globalAlpha = 1;

  // Hangar bay at boss section
  if (camera.x > 9500) {
    const hx = 10500 - camera.x;
    // Large open area
    ctx.fillStyle = '#111118';
    ctx.fillRect(hx, 30, 3500, H - 70);
    // Support columns
    for (let c = 0; c < 6; c++) {
      ctx.fillStyle = '#252530';
      ctx.fillRect(hx + 200 + c * 500, 30, 20, H - 70);
      ctx.fillStyle = '#333340';
      ctx.fillRect(hx + 200 + c * 500, 30, 20, 4);
      ctx.fillRect(hx + 200 + c * 500, H - 44, 20, 4);
    }
  }
}

function drawPlatforms() {
  platforms.forEach(p => {
    const sx = p.x - camera.x;
    if (sx > W + 50 || sx + p.w < -50) return;

    if (p.type === 'ground') {
      // Metal floor
      ctx.fillStyle = '#2a2a35';
      ctx.fillRect(sx, p.y, Math.min(p.w, W + 100), p.h);
      // Floor line detail
      ctx.fillStyle = '#3a3a45';
      ctx.fillRect(sx, p.y, Math.min(p.w, W + 100), 2);
      // Floor grid lines
      ctx.strokeStyle = '#333340';
      ctx.lineWidth = 1;
      for (let gx = Math.floor(camera.x / 50) * 50; gx < camera.x + W; gx += 50) {
        const glx = gx - camera.x;
        ctx.beginPath();
        ctx.moveTo(glx, p.y);
        ctx.lineTo(glx, p.y + p.h);
        ctx.stroke();
      }
    } else if (p.type === 'platform') {
      ctx.fillStyle = '#3a3a48';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.fillStyle = '#4a4a58';
      ctx.fillRect(sx, p.y, p.w, 3);
      // Support struts
      ctx.fillStyle = '#2a2a35';
      ctx.fillRect(sx + 10, p.y + p.h, 4, 20);
      ctx.fillRect(sx + p.w - 14, p.y + p.h, 4, 20);
      // Red accent
      ctx.fillStyle = '#FF1744';
      ctx.globalAlpha = 0.5;
      ctx.fillRect(sx + p.w / 2 - 10, p.y + 6, 20, 2);
      ctx.globalAlpha = 1;
    } else if (p.type === 'wall') {
      ctx.fillStyle = '#222230';
      ctx.fillRect(sx, p.y, p.w, p.h);
    }
  });
}

// ============================================================
// HUD
// ============================================================
function drawHUD() {
  // HP Bar
  ctx.fillStyle = '#333';
  ctx.fillRect(10, 10, 200, 18);
  const hpPct = luke.hp / luke.maxHp;
  const hpColor = hpPct > 0.5 ? '#4CAF50' : hpPct > 0.25 ? '#FFC107' : '#F44336';
  ctx.fillStyle = hpColor;
  ctx.fillRect(10, 10, 200 * hpPct, 18);
  ctx.strokeStyle = '#FFF';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, 200, 18);
  ctx.fillStyle = '#FFF';
  ctx.font = '11px Arial';
  ctx.fillText(`HP: ${luke.hp}/${luke.maxHp}`, 15, 24);

  // Lives (lightsaber icons)
  for (let i = 0; i < luke.lives; i++) {
    const lx = 10 + i * 25;
    ctx.fillStyle = '#888';
    ctx.fillRect(lx, 34, 3, 10);
    ctx.fillStyle = '#4FC3F7';
    ctx.shadowColor = '#4FC3F7';
    ctx.shadowBlur = 4;
    ctx.fillRect(lx, 34 - 12, 3, 12);
    ctx.shadowBlur = 0;
  }

  // Shield bar (under HP)
  if (luke.shield > 0) {
    ctx.fillStyle = '#333';
    ctx.fillRect(10, 30, 200, 8);
    ctx.fillStyle = '#2196F3';
    ctx.fillRect(10, 30, 200 * (luke.shield / luke.maxShield), 8);
    ctx.strokeStyle = '#4FC3F7';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(10, 30, 200, 8);
    ctx.fillStyle = '#FFF';
    ctx.font = '7px Arial';
    ctx.fillText(`SHIELD: ${luke.shield}`, 15, 37);
  }

  // Force powers cooldowns
  const forceY = luke.shield > 0 ? 44 : 34;
  const forcePowers = [
    { name: 'PUSH [X]', pct: 1 - luke.forcePushCooldown / luke.forcePushMaxCooldown, color: '#7B1FA2' },
    { name: 'PULL [C]', pct: 1 - luke.forcePullCooldown / luke.forcePullMaxCooldown, color: '#4FC3F7' },
    { name: 'SPEED [S]', pct: 1 - luke.forceSpeedCooldown / luke.forceSpeedMaxCooldown, color: '#FF6D00' }
  ];
  forcePowers.forEach((fp, i) => {
    const fy = forceY + i * 14;
    ctx.fillStyle = '#333';
    ctx.fillRect(10, fy, 60, 10);
    ctx.fillStyle = fp.pct >= 1 ? fp.color : '#555';
    ctx.fillRect(10, fy, 60 * fp.pct, 10);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(10, fy, 60, 10);
    ctx.fillStyle = fp.pct >= 1 ? '#FFF' : '#999';
    ctx.font = '7px Arial';
    ctx.fillText(fp.name, 14, fy + 8);
  });

  // Force speed active indicator
  if (luke.forceSpeedActive > 0) {
    ctx.globalAlpha = 0.3 + Math.sin(Date.now()/100) * 0.1;
    ctx.strokeStyle = '#FF6D00';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // Score
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'right';
  ctx.fillText(`SCORE: ${score}`, W - 10, 26);

  // Combo display
  if (luke.combo > 1) {
    ctx.fillStyle = '#FF6D00';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`COMBO x${luke.combo} (${luke.comboMultiplier}x)`, W - 10, 44);
  }
  ctx.textAlign = 'left';

  // Boss HP bar
  if (bossActive && vader && vader.alive) {
    const bw = 400;
    const bx = (W - bw) / 2;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, 10, bw, 22);
    ctx.fillStyle = '#FF1744';
    ctx.fillRect(bx, 10, bw * (vader.hp / vader.maxHp), 22);
    ctx.strokeStyle = '#FFF';
    ctx.strokeRect(bx, 10, bw, 22);
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('DARTH VADER', W / 2, 26);
    ctx.textAlign = 'left';
  }

  // Progress bar
  const progBarW = 200;
  const progBarH = 6;
  const progBarX = (W - progBarW) / 2;
  const progBarY = H - (isTouchDevice ? 8 : 22);
  const progress = Math.min(1, luke.x / LEVEL_WIDTH);
  // Background
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(progBarX, progBarY, progBarW, progBarH);
  // Filled portion
  ctx.fillStyle = 'rgba(255,215,0,0.5)';
  ctx.fillRect(progBarX, progBarY, progBarW * progress, progBarH);
  // Section markers
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  const sections = [2500, 5000, 7000, 9500, 10500];
  sections.forEach(s => {
    const sx = progBarX + (s / LEVEL_WIDTH) * progBarW;
    ctx.fillRect(sx, progBarY - 1, 1, progBarH + 2);
  });
  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(progBarX, progBarY, progBarW, progBarH);
  // Player dot
  const dotX = progBarX + progress * progBarW;
  ctx.fillStyle = '#66BB6A';
  ctx.shadowColor = '#66BB6A';
  ctx.shadowBlur = 4;
  ctx.fillRect(dotX - 2, progBarY - 2, 4, progBarH + 4);
  ctx.shadowBlur = 0;
  // Boss marker
  ctx.fillStyle = '#FF1744';
  const bossX = progBarX + (10700 / LEVEL_WIDTH) * progBarW;
  ctx.fillRect(bossX - 1, progBarY - 2, 3, progBarH + 4);

  // Controls hint
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px Arial';
  ctx.textAlign = 'center';
  if (!isTouchDevice) {
    ctx.fillText('\u2190\u2192 Move | Space Jump | Z Attack | A Block | X Push | C Pull | S Speed', W / 2, H - 10);
  }
  ctx.textAlign = 'left';

  // Checkpoint text
  if (checkpointText.timer > 0) {
    checkpointText.timer--;
    ctx.globalAlpha = Math.min(1, checkpointText.timer / 30);
    ctx.fillStyle = '#4FC3F7';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#4FC3F7';
    ctx.shadowBlur = 10;
    ctx.fillText(checkpointText.text, W / 2, H / 2 - 20);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Damage flash
  if (damageFlash > 0) {
    damageFlash--;
    ctx.fillStyle = `rgba(255, 0, 0, ${damageFlash / 20})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ============================================================
// SCREENS
// ============================================================
let titleSaberLen = 0;
let titleTimer = 0;

function drawStartScreen() {
  titleTimer += 0.016;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Stars
  const colors = ['#668', '#99b', '#ddf'];
  for (let layer = 0; layer < 3; layer++) {
    ctx.fillStyle = colors[layer];
    stars[layer].forEach(s => {
      const x = s.x % W;
      ctx.globalAlpha = s.brightness * (0.7 + Math.sin(Date.now() / 1000 + s.x) * 0.3);
      ctx.fillRect(x, s.y, s.size, s.size);
    });
  }
  ctx.globalAlpha = 1;

  // Title
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 64px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 20;
  ctx.fillText('STAR WARS', W / 2, 180);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = '#4FC3F7';
  ctx.font = '20px Arial';
  ctx.fillText('A NEW HOPE \u2014 THE GAME', W / 2, 220);

  // Animated lightsaber
  titleSaberLen = Math.min(titleSaberLen + 2, 120);
  const saberX = W / 2;
  const saberY = 260;
  // Handle
  ctx.fillStyle = '#888';
  ctx.fillRect(saberX - 3, saberY, 6, 20);
  // Blade
  ctx.fillStyle = '#4FC3F7';
  ctx.shadowColor = '#4FC3F7';
  ctx.shadowBlur = 15;
  ctx.fillRect(saberX - 2, saberY - titleSaberLen, 4, titleSaberLen);
  ctx.shadowBlur = 0;

  // Press Enter
  ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 400) * 0.5;
  ctx.fillStyle = '#FFF';
  ctx.font = '18px Arial';
  ctx.fillText(isTouchDevice ? 'Tap to Begin' : 'Press ENTER to Begin', W / 2, 440);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(30, 0, 0, 0.95)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#FF1744';
  ctx.font = 'bold 60px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#FF1744';
  ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W / 2, 200);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#FFF';
  ctx.font = '24px Arial';
  ctx.fillText(`Final Score: ${score}`, W / 2, 280);

  ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 400) * 0.5;
  ctx.fillStyle = '#FFF';
  ctx.font = '18px Arial';
  ctx.fillText(isTouchDevice ? 'Tap to Retry' : 'Press ENTER to Retry', W / 2, 380);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawVictoryScreen() {
  ctx.fillStyle = 'rgba(30, 25, 0, 0.95)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 36px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 20;
  ctx.fillText('YOU HAVE DEFEATED DARTH VADER', W / 2, 180);
  ctx.shadowBlur = 0;

  const timeSec = ((gameEndTime - gameStartTime) / 1000).toFixed(1);
  ctx.fillStyle = '#FFF';
  ctx.font = '24px Arial';
  ctx.fillText(`Final Score: ${score}`, W / 2, 260);
  ctx.fillText(`Time: ${timeSec}s`, W / 2, 300);

  // Animated victory text
  ctx.fillStyle = '#4FC3F7';
  ctx.font = '16px Arial';
  const bounce = Math.sin(Date.now() / 300) * 5;
  ctx.fillText('The Force is strong with you.', W / 2, 350 + bounce);

  ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 400) * 0.5;
  ctx.fillStyle = '#FFF';
  ctx.font = '18px Arial';
  ctx.fillText(isTouchDevice ? 'Tap to Play Again' : 'Press ENTER to Play Again', W / 2, 440);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ============================================================
// UTILITY
// ============================================================
function rectsOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
  return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

// ============================================================
// GAME INIT & LOOP
// ============================================================
function initGame() {
  luke = createLuke();
  generateStars();
  buildLevel();
  spawnEnemies();
  spawnPickups();
  vader = createVader();
  projectiles = [];
  particles = [];
  score = 0;
  camera.x = 0;
  bossActive = false;
  bossEntrancePlaying = false;
  bossEntranceTimer = 0;
  checkpointText = { text: '', timer: 0 };
  damageFlash = 0;
  screenShake = 0;
  currentMusicSection = -1;
  footstepTimer = 0;
  gameStartTime = Date.now();
  startSaberHum();
  startVaderBreathing();
}

function update() {
  if (gameState !== 'playing' || paused) return;

  updateLuke();
  updateEnemies();
  updateProjectiles();
  updateParticles();
  updatePickups();
  updateVader();
  updateSectionMusic();

  // Boss trigger
  if (!bossActive && luke.x > 10700 && vader && vader.alive) {
    bossActive = true;
    bossEntrancePlaying = true;
    bossEntranceTimer = 120;
    playSound('bossDrone');
  }

  if (bossEntrancePlaying) {
    bossEntranceTimer--;
    if (bossEntranceTimer <= 0) bossEntrancePlaying = false;
  }

  // Screen shake decay
  if (screenShake > 0) screenShake--;
}

function draw() {
  ctx.save();

  // Screen shake
  if (screenShake > 0) {
    const sx = (Math.random() - 0.5) * screenShakeIntensity * 2;
    const sy = (Math.random() - 0.5) * screenShakeIntensity * 2;
    ctx.translate(sx, sy);
  }

  if (gameState === 'start') {
    drawStartScreen();
  } else if (gameState === 'playing') {
    drawBackground();
    drawPlatforms();
    drawPickups();
    drawEnemies();
    drawProjectiles();
    drawLuke();
    drawVader();
    drawParticles();
    drawHUD();

    // Boss entrance text
    if (bossEntrancePlaying) {
      ctx.globalAlpha = Math.min(1, bossEntranceTimer / 30);
      ctx.fillStyle = '#FF1744';
      ctx.font = 'bold 32px "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#FF1744';
      ctx.shadowBlur = 15;
      ctx.fillText('DARTH VADER', W / 2, H / 2 - 40);
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  } else if (gameState === 'gameover') {
    drawGameOverScreen();
  } else if (gameState === 'victory') {
    drawVictoryScreen();
  }

  // Pause overlay
  if (paused && gameState === 'playing') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 48px "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 15;
    ctx.fillText('PAUSED', W / 2, H / 2 - 30);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#FFF';
    ctx.font = '16px Arial';
    ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 400) * 0.5;
    ctx.fillText(isTouchDevice ? 'Tap pause to resume' : 'Press ESC to resume', W / 2, H / 2 + 20);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Shared game start/restart logic
function startOrRestartGame() {
  if (gameState === 'start') {
    initAudio();
  } else if (gameState === 'gameover' || gameState === 'victory') {
    stopImperialMarch();
  } else {
    return;
  }
  gameState = 'playing';
  paused = false;
  initGame();
  playImperialMarch();
}

// Input handler for screens
window.addEventListener('keydown', e => {
  if (e.code === 'Enter') startOrRestartGame();
});

// Start
generateStars();
gameLoop();
</script>
